services:
  dory:
    build: .
    command: python bot_dory.py
    env_file: .env
    restart: unless-stopped
  nemo:
    build: .
    command: python bot_nemo.py
    env_file: .env
    environment:
      DB_PATH: /data/bot_database.db
    volumes:
      - ./data:/data   # БД на хосте: память переживает пересборку контейнера
    restart: unless-stopped
